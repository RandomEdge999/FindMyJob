[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "findmyjob"
dynamic = ["version"]
description = "Terminal-first, compliance-first job discovery and application assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Find My Job Contributors" }
]
dependencies = [
  "alembic>=1.13.2",
  "anyio>=4.4.0",
  "fastapi>=0.109.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "keyring>=25.2.1",
  "platformdirs>=4.2.2",
  "pydantic>=2.8.2",
  "python-multipart>=0.0.9",
  "pypdf>=4.3.1",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.31",
  "tenacity>=8.5.0",
  "textual>=0.75.1,<0.76",
  "tomlkit>=0.13.2",
  "typer>=0.12.3",
  "tzdata>=2024.1;sys_platform=='win32'",
  "uvicorn>=0.27.0",
  "xlsxwriter>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.11.0",
  "vulture>=2.14",
]
models = [
  "litellm>=1.43.0",
]
playwright = [
  "playwright>=1.45.1",
]

[project.scripts]
fmj = "findmyjob.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/findmyjob"]

[tool.hatch.version]
path = "src/findmyjob/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/alembic",
  "/alembic.ini",
  "/docs/release.md",
  "/pyproject.toml",
  "/requirements",
  "/scripts/publish_audit.py",
  "/scripts/verify_release.py",
  "/src/findmyjob",
  "/templates/user-profile.local.example.yml",
  "/templates/typst",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "findmyjob/_bundled/alembic"
"alembic.ini" = "findmyjob/_bundled/alembic.ini"
"templates/typst" = "findmyjob/_bundled/templates/typst"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "timeout(seconds): mark a test with an execution timeout budget",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "frontend",
  "src/findmyjob/web/frontend_dist",
]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"src/findmyjob/core/runtime.py" = ["F401"]

[tool.vulture]
paths = ["src/findmyjob", "scripts/vulture_allowlist.py"]
exclude = ["alembic", "frontend", "src/findmyjob/web/frontend_dist", "tests"]
ignore_decorators = [
  "@app.command",
  "@config_app.command",
  "@models_app.command",
  "@profile_app.command",
  "@discover_app.command",
  "@prepare_app.command",
  "@apply_app.command",
  "@jobs_app.command",
  "@searches_app.command",
  "@review_app.command",
  "@onboard_app.command",
  "@personal_app.command",
  "@personal_prefs_app.command",
  "@personal_facts_app.command",
  "@personal_preview_app.command",
  "@support_app.command",
  "@ledger_app.command",
  "@runs_app.command",
  "@sources_app.command",
  "@greenhouse_app.command",
  "@auto_app.command",
  "@questions_app.command",
  "@boards_app.command",
  "@db_app.command",
  "@workflow_app.command",
  "@screen_app.command",
  "@chatgpt_app.command",
]
min_confidence = 80
sort_by_size = true
