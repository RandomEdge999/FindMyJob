[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "findmyjob"
dynamic = ["version"]
description = "Terminal-first, compliance-first job discovery and application assistant."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Find My Job Contributors" }
]
dependencies = [
  "alembic>=1.13.2",
  "anyio>=4.4.0",
  "fastapi>=0.109.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "keyring>=25.2.1",
  "platformdirs>=4.2.2",
  "pydantic>=2.8.2",
  "python-multipart>=0.0.9",
  "pypdf>=4.3.1",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.31",
  "tenacity>=8.5.0",
  "textual>=0.75.1,<0.76",
  "tomlkit>=0.13.2",
  "typer>=0.12.3",
  "tzdata>=2024.1;sys_platform=='win32'",
  "uvicorn>=0.27.0",
  "xlsxwriter>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
]
models = [
  "litellm>=1.43.0",
]
playwright = [
  "playwright>=1.45.1",
]

[project.scripts]
fmj = "findmyjob.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/findmyjob"]

[tool.hatch.version]
path = "src/findmyjob/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/alembic",
  "/alembic.ini",
  "/docs/release.md",
  "/pyproject.toml",
  "/requirements",
  "/scripts/publish_audit.py",
  "/scripts/verify_release.py",
  "/src/findmyjob",
  "/templates/user-profile.local.example.yml",
  "/templates/typst",
]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "findmyjob/_bundled/alembic"
"alembic.ini" = "findmyjob/_bundled/alembic.ini"
"templates/typst" = "findmyjob/_bundled/templates/typst"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "timeout(seconds): mark a test with an execution timeout budget",
]
