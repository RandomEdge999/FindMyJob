name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - '3.12'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Build frontend bundle
        run: npm --prefix frontend run build

      - name: Compile sources
        run: python -m compileall src tests alembic

      - name: Run test suite
        run: pytest -q

      - name: Audit public repository surface
        run: python scripts/publish_audit.py

      - name: Verify built artifacts in a clean environment
        run: >-
          python scripts/verify_release.py
          --dist-dir dist
          --workspace-dir .tmp/release-workspace
          --venv-dir .tmp/release-venv

